<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!-- Картинка для соцсетей 1200×630: фото первого экрана, градиент слева, заголовок страницы. Собирает render.mjs -->
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../../../fonts/inter-ru-wght-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:italic;font-weight:100 900;src:url(../../../fonts/inter-ru-wght-italic.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:#fff;position:relative}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:100% 40%}
.g{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.86) 40%,rgba(0,0,0,.35) 60%,rgba(0,0,0,0) 74%),linear-gradient(0deg,rgba(0,0,0,.7) 0,rgba(0,0,0,0) 26%)}
.in{position:absolute;inset:0;padding:40px 56px 44px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;letter-spacing:.01em}
.logo i{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;background:rgba(255,255,255,.04)}
.logo i svg{width:20px;height:20px}
.logo small{font-size:11px;font-weight:500;color:#7c86ff;text-transform:uppercase;letter-spacing:.08em;margin-left:2px}
.ey{display:flex;align-items:center;gap:12px;margin-top:auto;color:#a5adff;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.ey:before{content:"";width:30px;height:1px;background:#7c86ff}
h1{margin-top:18px;max-width:640px;font-weight:300;font-size:48px;line-height:1.08;letter-spacing:-.035em}
h1 em{font-style:italic;font-weight:600}
.ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;font-size:16px;color:#c4c4cc}
.ft b{color:#fff;font-weight:600}
</style></head>
<body>
<img class="ph" id="ph" src="" alt="">
<div class="g"></div>
<div class="in">
  <div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l7.5 3v6c0 5-3.2 8.6-7.5 10-4.3-1.4-7.5-5-7.5-10v-6z"/><circle cx="12" cy="11.5" r="2.6" stroke="#7c86ff"/><path d="M12 6.2v2.7M12 14.1v2.7M6.8 11.5h2.6M14.6 11.5h2.6" stroke="#7c86ff"/></svg></i>ПЕСТКОНТРОЛЬ<small>центр</small></div>
  <div class="ey" id="ey"></div>
  <h1 id="h1"></h1>
  <div class="ft"><span id="ft"></span><b>пестконтроль-центр.рф</b></div>
</div>
</body></html>
