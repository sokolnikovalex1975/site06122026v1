<svg viewBox="0 92 800 424" role="img" aria-labelledby="plan-bctc-t">
          <title id="plan-bctc-t">Разрез здания с восемью зонами риска: территория и контейнерная площадка, зона загрузки, подземный паркинг, подвал с тепловым пунктом, щитовые и кабельная шахта, мусорокамера, фуд-корт, офисные этажи</title>
          <!-- грунт и уровень земли -->
          <rect x="12" y="400" width="776" height="112" fill="rgba(255,255,255,.02)"/>
          <path d="M12 400H788" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
          <!-- зона 1: территория и контейнерная площадка -->
          <g class="z" data-z="1"><rect class="zf" x="16" y="286" width="150" height="112" rx="4"/></g>
          <g class="wt"><rect x="30" y="362" width="36" height="36" rx="4"/><rect x="74" y="362" width="36" height="36" rx="4"/></g>
          <path d="M26 362H114" stroke="#52525b" stroke-width="3" stroke-linecap="round"/>
          <!-- здание: надземная часть и подземный этаж -->
          <rect class="wf" x="170" y="110" width="460" height="290" rx="4"/>
          <rect class="wf" x="110" y="400" width="580" height="100"/>
          <!-- зона 8: офисные этажи -->
          <g class="z" data-z="8"><path class="zf" d="M172 112H374V318H172Z M426 112H628V318H426Z"/></g>
          <!-- зона 6: мусорокамера; зона 7: фуд-корт; зона 2: загрузка и дебаркадер -->
          <g class="z" data-z="6"><rect class="zf" x="172" y="322" width="76" height="76"/></g>
          <g class="z" data-z="7"><rect class="zf" x="252" y="322" width="122" height="76"/></g>
          <g class="z" data-z="2"><rect class="zf" x="522" y="322" width="254" height="76" rx="3"/></g>
          <!-- зона 3: паркинг; зона 4: подвал, тепловой пункт, венткамеры -->
          <g class="z" data-z="3"><rect class="zf" x="112" y="402" width="336" height="96"/></g>
          <g class="z" data-z="4"><rect class="zf" x="452" y="402" width="236" height="96"/></g>
          <!-- зона 5: щитовые, серверные, кабельная шахта -->
          <g class="z" data-z="5"><rect class="zf" x="378" y="112" width="44" height="286"/></g>
          <!-- перекрытия и перегородки -->
          <g fill="none" stroke="#3f3f46" stroke-width="2">
            <path d="M170 180H376M424 180H630M170 250H376M424 250H630M170 320H630"/>
            <path d="M376 110V400M424 110V400M250 320V400M520 320V400M450 400V500"/>
          </g>
          <!-- пространство над подвесным потолком -->
          <path class="wc" d="M176 124H372M430 124H624M176 194H372M430 194H624M176 264H372M430 264H624"/>
          <!-- кабели в шахте -->
          <path d="M392 118V394M400 118V394M408 118V394" fill="none" stroke="#71717a" stroke-width="1.4" stroke-dasharray="3 5"/>
          <!-- окна правого крыла -->
          <g class="wr"><rect x="446" y="140" width="34" height="26" rx="2"/><rect x="494" y="140" width="34" height="26" rx="2"/><rect x="542" y="140" width="34" height="26" rx="2"/><rect x="590" y="140" width="26" height="26" rx="2"/><rect x="446" y="210" width="34" height="26" rx="2"/><rect x="494" y="210" width="34" height="26" rx="2"/><rect x="542" y="210" width="34" height="26" rx="2"/><rect x="590" y="210" width="26" height="26" rx="2"/><rect x="446" y="280" width="34" height="26" rx="2"/><rect x="494" y="280" width="34" height="26" rx="2"/><rect x="542" y="280" width="34" height="26" rx="2"/><rect x="590" y="280" width="26" height="26" rx="2"/></g>
          <!-- кровля -->
          <path d="M160 110H640" stroke="#71717a" stroke-width="4" stroke-linecap="round"/>
          <!-- дебаркадер и машина у зоны загрузки -->
          <rect class="wd" x="630" y="384" width="40" height="16" rx="2"/>
          <g class="wt"><rect x="676" y="342" width="92" height="44" rx="4"/><circle cx="696" cy="392" r="7"/><circle cx="750" cy="392" r="7"/></g>
          <!-- паркинг: машины и приямок с водой -->
          <g class="wt"><rect x="150" y="468" width="60" height="24" rx="9"/><rect x="232" y="468" width="60" height="24" rx="9"/><rect x="314" y="468" width="60" height="24" rx="9"/></g>
          <rect x="396" y="492" width="40" height="8" fill="#38bdf8" opacity=".55"/>
          <!-- тепловой пункт и венткамера -->
          <g class="wt"><rect x="482" y="452" width="40" height="44" rx="4"/><rect x="536" y="442" width="30" height="54" rx="15"/><rect x="592" y="458" width="72" height="38" rx="4"/></g>
          <!-- подписи -->
          <g class="lbl">
            <text x="24" y="308">Территория</text>
            <text x="186" y="154">Офисы</text>
            <text x="186" y="224">Офисные кухни</text>
            <text x="186" y="294">Серверная</text>
            <text x="262" y="344">Фуд-корт</text>
            <text x="436" y="364">Галерея</text>
            <text x="532" y="344">Загрузка</text>
            <text x="124" y="428">Паркинг</text>
            <text x="462" y="428">Тепловой пункт</text>
          </g>
          <!-- станции с приманкой: снаружи и в паркинге -->
          <g class="ms" stroke="#09090b" stroke-width="2">
            <rect x="118" y="386" width="12" height="12" rx="3"/><rect x="152" y="386" width="12" height="12" rx="3"/><rect x="774" y="386" width="12" height="12" rx="3"/>
            <rect x="114" y="440" width="12" height="12" rx="3"/><rect x="264" y="404" width="12" height="12" rx="3"/><rect x="434" y="440" width="12" height="12" rx="3"/>
            <rect x="454" y="484" width="12" height="12" rx="3"/><rect x="674" y="440" width="12" height="12" rx="3"/>
          </g>
          <!-- ловушки без яда: щитовые, шахта, загрузка, мусорокамера -->
          <g class="mr" stroke="#09090b" stroke-width="2">
            <rect x="380" y="166" width="11" height="11" rx="2"/><rect x="380" y="306" width="11" height="11" rx="2"/><rect x="409" y="384" width="11" height="11" rx="2"/>
            <rect x="526" y="385" width="11" height="11" rx="2"/><rect x="560" y="385" width="11" height="11" rx="2"/>
            <rect x="176" y="385" width="11" height="11" rx="2"/><rect x="234" y="385" width="11" height="11" rx="2"/>
          </g>
          <!-- клеевые мониторы: кухни и фуд-корт -->
          <g class="mp"><circle cx="268" cy="390" r="5"/><circle cx="362" cy="390" r="5"/><circle cx="300" cy="390" r="5"/><circle cx="352" cy="242" r="5"/><circle cx="200" cy="312" r="5"/><circle cx="352" cy="172" r="5"/><circle cx="440" cy="312" r="5"/><circle cx="440" cy="242" r="5"/></g>
          <!-- номера зон -->
          <g class="bdgs">
            <g class="bdg" data-z="1"><circle cx="134" cy="322" r="18"/><text x="134" y="323">1</text></g>
            <g class="bdg" data-z="2"><circle cx="600" cy="372" r="16"/><text x="600" y="373">2</text></g>
            <g class="bdg" data-z="3"><circle cx="330" cy="436" r="18"/><text x="330" y="437">3</text></g>
            <g class="bdg" data-z="4"><circle cx="640" cy="424" r="16"/><text x="640" y="425">4</text></g>
            <g class="bdg" data-z="5"><circle cx="400" cy="232" r="16"/><text x="400" y="233">5</text></g>
            <g class="bdg" data-z="6"><circle cx="210" cy="352" r="16"/><text x="210" y="353">6</text></g>
            <g class="bdg" data-z="7"><circle cx="346" cy="364" r="16"/><text x="346" y="365">7</text></g>
            <g class="bdg" data-z="8"><circle cx="330" cy="150" r="18"/><text x="330" y="151">8</text></g>
          </g>
        </svg>
